[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brock-backend"
version = "0.1.0"
description = "Backend serverless de Brock"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "pydantic>=2.9,<3",
  "aws-lambda-powertools>=3,<4",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "moto[dynamodb]>=5,<6",
  "boto3-stubs[dynamodb,lambda,bedrock-runtime]>=1.35,<2",
  "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "evaluacion"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
