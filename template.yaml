AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Brock v1 - infraestructura serverless por entorno

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  BedrockModelId:
    Type: String
    MinLength: 1
    Description: ID de un foundation model regional compatible con Converse
  CupoDiario:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100
  AlertEmail:
    Type: String
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    Description: Correo de alertas operativas y presupuesto
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    MinValue: 1
  BedrockInputPricePerMillion:
    Type: String
    Default: '0'
    AllowedPattern: '^[0-9]+(\.[0-9]+)?$'
  BedrockOutputPricePerMillion:
    Type: String
    Default: '0'
    AllowedPattern: '^[0-9]+(\.[0-9]+)?$'

Mappings:
  StageConfig:
    dev:
      Rate: 5
      Burst: 10
    prod:
      Rate: 20
      Burst: 40

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: backend/
    Environment:
      Variables:
        TABLE_NAME: !Ref Tabla
        STAGE: !Ref Stage
        CUPO_DIARIO: !Ref CupoDiario
        QUOTA_TIMEZONE: America/Lima
        POWERTOOLS_METRICS_NAMESPACE: !Sub Brock/${Stage}
    Tags:
      Project: Brock
      Stage: !Ref Stage

Resources:
  Tabla:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub brock-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: Brock
        - Key: Stage
          Value: !Ref Stage

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub brock-${Stage}
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Verifica tu correo en Brock
        EmailMessage: 'Tu código de verificación de Brock es {####}.'
      UserPoolTags:
        Project: Brock
        Stage: !Ref Stage

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub brock-web-${Stage}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 30
      IdTokenValidity: 30
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: Brock
        - Key: Stage
          Value: !Ref Stage

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub brock-${Stage}-${AWS::AccountId}-${AWS::Region}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOac
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: Brock
        - Key: Stage
          Value: !Ref Stage

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub '${FrontendBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${FrontendDistribution.DomainName}
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, PUT, POST, PATCH, DELETE, OPTIONS]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingRateLimit: !FindInMap [StageConfig, !Ref Stage, Rate]
        ThrottlingBurstLimit: !FindInMap [StageConfig, !Ref Stage, Burst]
        DetailedMetricsEnabled: true
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
              audience: [!Ref UserPoolClient]
      Tags:
        Project: Brock
        Stage: !Ref Stage

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/brock-api-${Stage}
      RetentionInDays: 14

  GeneradorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/brock-generador-${Stage}
      RetentionInDays: 14

  GeneradorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: generador
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt GeneradorLogGroup.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:PutItem, dynamodb:TransactWriteItems, dynamodb:ConditionCheckItem]
                Resource: !GetAtt Tabla.Arn
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:Converse]
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:brock-api-${Stage}

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApiLogGroup.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:BatchWriteItem, dynamodb:TransactWriteItems, dynamodb:ConditionCheckItem]
                Resource: !GetAtt Tabla.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FnGenerador.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:brock-api-${Stage}
              - Effect: Allow
                Action: [cognito-idp:AdminGetUser, cognito-idp:AdminDisableUser, cognito-idp:AdminDeleteUser]
                Resource: !GetAtt UserPool.Arn

  FnGenerador:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brock-generador-${Stage}
      Handler: generador.app.handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt GeneradorRole.Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref GeneradorLogGroup
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MAX_OUTPUT_TOKENS: '8192'
          BEDROCK_INPUT_PRICE_PER_MILLION: !Ref BedrockInputPricePerMillion
          BEDROCK_OUTPUT_PRICE_PER_MILLION: !Ref BedrockOutputPricePerMillion
          POWERTOOLS_SERVICE_NAME: generador
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 60
        DestinationConfig:
          OnFailure:
            Type: Lambda
            Destination: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:brock-api-${Stage}

  FnApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub brock-api-${Stage}
      Handler: api.app.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          FN_GENERADOR: !Ref FnGenerador
          USER_POOL_ID: !Ref UserPool
          POWERTOOLS_SERVICE_NAME: api
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub brock-alertas-${Stage}
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:brock-${Stage}-*

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub brock-${Stage}-api-errors
      AlarmDescription: Errores en Lambda API
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FnApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  GeneradorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub brock-${Stage}-generador-errors
      AlarmDescription: Errores en Lambda generador
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FnGenerador
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub brock-${Stage}-api-5xx
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref Api
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub brock-${Stage}-mensual
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        CostTypes:
          UseAmortized: false
          UseBlended: false
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}
  FrontendUrl:
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref FrontendDistribution
  TableName:
    Value: !Ref Tabla
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
  AlertTopicArn:
    Value: !Ref AlertTopic
